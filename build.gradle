// avoid problem https://github.com/flyway/flyway/issues/3998
buildscript {
    dependencies {
        classpath("org.flywaydb:flyway-database-postgresql:11.8.0")
    }
}

plugins {
  id 'java'
  id 'org.springframework.boot' version '3.4.0'
  id 'io.spring.dependency-management' version '1.1.7'
  id 'org.asciidoctor.jvm.convert' version '3.3.2'
  id 'org.flywaydb.flyway' version '11.8.0'
  id 'co.uzzu.dotenv.gradle' version '4.0.0'
}

group = 'me.crvena'
version = '0.0.1-SNAPSHOT'

java {
  toolchain {
  	languageVersion = JavaLanguageVersion.of(21)
  }
}

configurations {
  compileOnly {
  	extendsFrom annotationProcessor
  }
}

repositories {
  mavenCentral()
  mavenLocal()
}

ext {
  set('snippetsDir', file('build/generated-snippets'))
}

dependencies {
  implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
  implementation 'org.springframework.boot:spring-boot-starter-data-rest'
  // implementation 'org.springframework.boot:spring-boot-starter-security'
  implementation 'org.springframework.boot:spring-boot-starter-validation'
  implementation 'org.springframework.boot:spring-boot-starter-web'
  implementation 'org.flywaydb:flyway-core:11.8.0'
  implementation 'org.flywaydb:flyway-database-postgresql'
  implementation 'tech.ailef:snap-admin:0.2.3' // WARN: requires NoArgsConstructor
  compileOnly 'org.projectlombok:lombok'
  developmentOnly 'org.springframework.boot:spring-boot-devtools'
  runtimeOnly 'org.postgresql:postgresql'
  annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'
  annotationProcessor 'org.projectlombok:lombok'
  testImplementation 'org.springframework.boot:spring-boot-starter-test'
  testImplementation 'org.springframework.restdocs:spring-restdocs-mockmvc'
  // testImplementation 'org.springframework.security:spring-security-test'
  testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
  outputs.dir snippetsDir
  useJUnitPlatform()
}

tasks.named('asciidoctor') {
  inputs.dir snippetsDir
  dependsOn test
}

tasks.named('bootRun') {
  systemProperty 'spring.profiles.active', 'dev'
}

flyway {
  url = env.DATABASE_URL.value
  user = env.DATABASE_USERNAME.value
  password = env.DATABASE_PASSWORD.value
}
